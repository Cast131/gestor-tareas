<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>Gestor de Tareas</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="sidebar-btn active" data-panel="nueva">
                    <span class="sidebar-icon">+</span> Nueva tarea
                </button>
                <button class="sidebar-btn" data-panel="actividades">
                    <span class="sidebar-icon">📋</span> Mis actividades
                </button>
                <button class="sidebar-btn" data-panel="clientes">
                    <span class="sidebar-icon">👥</span> Clientes
                </button>
                <button class="sidebar-btn" data-panel="historial">
                    <span class="sidebar-icon">📊</span> Historial
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <section id="panel-nueva" class="panel active">
                <h1>Agregar Actividad</h1>

                <div class="form-section">
                    <form id="task-form">
                        <div class="input-group">
                            <label for="cliente-select">Cliente</label>
                            <div class="cliente-select-row">
                                <select id="cliente-select" required>
                                    <option value="">Selecciona un cliente...</option>
                                </select>
                                <button type="button" id="btn-add-cliente-inline" class="btn-add-inline" title="Agregar cliente">+</button>
                            </div>
                        </div>

                        <div class="input-group" id="inline-cliente-form" style="display:none;">
                            <div class="inline-form-row">
                                <input type="text" id="inline-nombre" placeholder="Nombre del cliente" class="inline-input">
                                <input type="text" id="inline-telefono" placeholder="Teléfono (opcional)" class="inline-input inline-tel">
                            </div>
                            <div class="inline-form-actions">
                                <button type="button" id="btn-save-inline" class="btn-save-inline">Guardar</button>
                                <button type="button" id="btn-cancel-inline" class="btn-cancel-inline">Cancelar</button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="materia">Materia o Carrera</label>
                            <input type="text" id="materia" placeholder="Ej. Cálculo I / Ingeniería" required>
                        </div>

                        <div class="input-group">
                            <label for="tarea">Tarea a desarrollar</label>
                            <textarea id="tarea" rows="3" placeholder="Describe lo que hay que hacer..." required></textarea>
                        </div>

                        <div class="input-group">
                            <label for="fecha">Fecha de entrega</label>
                            <div class="custom-datepicker">
                                <input type="text" id="fecha" class="date-input" placeholder="Selecciona una fecha" readonly required>
                                <div class="calendar-dropdown" id="calendar-dropdown">
                                    <div class="calendar-header">
                                        <button type="button" class="cal-nav cal-prev" id="cal-prev">&lt;</button>
                                        <span class="cal-month-year" id="cal-month-year"></span>
                                        <button type="button" class="cal-nav cal-next" id="cal-next">&gt;</button>
                                    </div>
                                    <div class="calendar-weekdays">
                                        <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
                                    </div>
                                    <div class="calendar-days" id="calendar-days"></div>
                                </div>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="prioridad">Prioridad</label>
                            <select id="prioridad" class="select-priority">
                                <option value="alta">Alta</option>
                                <option value="media" selected>Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-submit">Agregar Actividad</button>
                    </form>
                </div>
            </section>

            <section id="panel-actividades" class="panel">
                <h1>Mis Actividades</h1>

                <div class="actividades-layout">
                <div class="actividades-calendar" id="actividades-calendar">
                    <div class="calendar-header">
                        <button type="button" class="cal-nav" id="act-cal-prev">&lt;</button>
                        <span class="cal-month-year" id="act-cal-month-year"></span>
                        <button type="button" class="cal-nav" id="act-cal-next">&gt;</button>
                    </div>
                    <div class="calendar-weekdays">
                        <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
                    </div>
                    <div class="calendar-days" id="act-calendar-days"></div>
                    <div class="calendar-clear" id="calendar-clear">
                        <button type="button" id="btn-clear-date">Ver todas las fechas</button>
                    </div>
                </div>

                <div class="task-list-section">
                    <div class="filter-bar">
                        <h2 id="filter-title">Todas las tareas</h2>
                        <div class="filter-controls">
                            <input type="text" id="search-input" class="search-input" placeholder="Buscar tarea...">
                            <select id="filter-status" class="filter-select">
                                <option value="todas">Todas</option>
                                <option value="pendientes">Pendientes</option>
                                <option value="completadas">Completadas</option>
                            </select>
                            <select id="filter-priority" class="filter-select">
                                <option value="todas">Todas las prioridades</option>
                                <option value="alta">Alta</option>
                                <option value="media">Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                    </div>
                    <div id="tasks-container">
                    </div>
                </div>
                </div>
            </section>

            <section id="panel-clientes" class="panel">
                <h1>Clientes</h1>

                <div class="clientes-add-row">
                    <input type="text" id="cliente-nombre" placeholder="Nombre del cliente" class="cliente-input">
                    <input type="text" id="cliente-telefono" placeholder="Teléfono (opcional)" class="cliente-input cliente-tel">
                    <button type="button" id="btn-add-cliente" class="btn-add-cliente">Agregar cliente</button>
                </div>

                <div class="clientes-list" id="clientes-list">
                </div>
            </section>

            <section id="panel-historial" class="panel">
                <h1>Historial de Actividades</h1>

                <div class="historial-filters">
                    <select id="historial-cliente-filter" class="filter-select">
                        <option value="todas">Todos los clientes</option>
                    </select>
                    <select id="historial-status-filter" class="filter-select">
                        <option value="todas">Todas</option>
                        <option value="pendientes">Pendientes</option>
                        <option value="completadas">Completadas</option>
                    </select>
                    <select id="historial-priority-filter" class="filter-select">
                        <option value="todas">Todas las prioridades</option>
                        <option value="alta">Alta</option>
                        <option value="media">Media</option>
                        <option value="baja">Baja</option>
                    </select>
                </div>

                <div class="historial-table-wrapper">
                    <table class="historial-table" id="historial-table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Materia</th>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th>Prioridad</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="historial-tbody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
